<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Case Tinder - 每日創意案例</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Sign-in Gate -->
    <div class="signin-gate" id="signinGate">
        <div class="signin-container">
            <h1 class="signin-title">你是誰？</h1>
            <p class="signin-subtitle">加入 Alien Team</p>
            
            <div class="signin-form" id="signinForm">
                <div class="form-step" id="codeStep">
                    <input 
                        type="text" 
                        class="signin-input" 
                        id="inviteCodeInput" 
                        placeholder="邀請碼"
                        autocomplete="off"
                    >
                    <button class="signin-button" id="codeSubmitBtn">繼續</button>
                </div>
                
                <div class="form-step hidden" id="nameStep">
                    <p class="step-instruction">選擇你的名字</p>
                    <div class="name-list" id="nameList">
                        <!-- Names will be loaded from API -->
                    </div>
                </div>
            </div>
            
            <div class="error-message" id="errorMessage"></div>
        </div>
    </div>

    <div class="app-container">
        <!-- Tab Content -->
        <div class="tab-content" id="bioTab">
            <!-- My Bio Tab -->
            <div class="bio-container">
                <!-- Streak Headline -->
                <div class="streak-headline">
                    <h1>恭喜，您已經連續 <span class="streak-number" id="streakNumber">0</span> 天 都有看案例！</h1>
                </div>

                <!-- Lion Character -->
                <div class="lion-character" id="lionCharacter">
                    <!-- Lion layers will be loaded dynamically -->
                </div>

                <div class="lion-caption">離創意大獅的路已經不遠了！</div>

                <!-- Next Unlock -->
                <div class="next-unlock" id="nextUnlock">
                    <div class="unlock-text">再 <span id="daysToUnlock">2</span> 天即可解鎖：<span id="nextMerchName">貝雷帽</span></div>
                    
                    <!-- Progress Track -->
                    <div class="progress-track">
                        <div class="track-line"></div>
                        <div class="track-icon" id="trackIcon">
                            <div class="merch-icon beret-icon"></div>
                        </div>
                    </div>
                </div>

                <!-- Merch Grid -->
                <div class="merch-grid">
                    <div class="merch-item" data-merch="beret" data-days="2">
                        <div class="merch-icon beret-icon"></div>
                        <div class="merch-label">第1趟</div>
                        <div class="merch-name">貝雷帽</div>
                        <div class="check-mark">✓</div>
                    </div>
                    <div class="merch-item" data-merch="sunglasses" data-days="4">
                        <div class="merch-icon sunglasses-icon"></div>
                        <div class="merch-label">第2趟</div>
                        <div class="merch-name">墨鏡</div>
                        <div class="check-mark">✓</div>
                    </div>
                    <div class="merch-item" data-merch="necklace" data-days="6">
                        <div class="merch-icon necklace-icon"></div>
                        <div class="merch-label">第3趟</div>
                        <div class="merch-name">金獅項鍊</div>
                        <div class="check-mark">✓</div>
                    </div>
                    <div class="merch-item" data-merch="bag" data-days="8">
                        <div class="merch-icon bag-icon"></div>
                        <div class="merch-label">第4趟</div>
                        <div class="merch-name">創意小包</div>
                        <div class="check-mark">✓</div>
                    </div>
                    <div class="merch-item" data-merch="snowboard" data-days="10">
                        <div class="merch-icon snowboard-icon"></div>
                        <div class="merch-label">第5趟</div>
                        <div class="merch-name">滑雪板</div>
                        <div class="check-mark">✓</div>
                    </div>
                    <div class="merch-item" data-merch="crown" data-days="12">
                        <div class="merch-icon crown-icon"></div>
                        <div class="merch-label">第6趟</div>
                        <div class="merch-name">小皇冠</div>
                        <div class="check-mark">✓</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="tab-content active" id="casesTab">
            <!-- Card Stack -->
            <div class="card-stack" id="cardStack">
                <!-- Cards will be dynamically rendered here -->
            </div>

            <!-- Empty State -->
            <div class="empty-state" id="emptyState" style="display: none;">
                <div class="empty-icon">🎉</div>
                <h2>今天看完了！</h2>
                <p>明天再來看更多精彩案例</p>
            </div>
        </div>

        <div class="tab-content" id="scoreboardTab">
            <!-- Screen A: Team Ranking -->
            <div class="scoreboard-view active" id="rankingView">
                <div class="scoreboard-header">
                    <h1 class="scoreboard-title">團隊排行榜</h1>
                    <div class="team-subtitle">ALIEN TEAM</div>
                </div>
                <div class="ranking-list" id="rankingList">
                    <!-- Team members will be rendered here -->
                </div>
            </div>

            <!-- Screen B: Liked Cases Detail -->
            <div class="scoreboard-view" id="likedCasesView">
                <div class="detail-header">
                    <button class="back-button" id="backToRanking">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M19 12H5M12 19l-7-7 7-7"/>
                        </svg>
                    </button>
                    <h2 class="detail-title" id="detailTitle">喜歡的案例</h2>
                </div>
                <div class="liked-cases-container" id="likedCasesContainer">
                    <!-- Liked cases will be rendered here -->
                </div>
            </div>
        </div>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav">
            <button class="nav-item" data-tab="bioTab">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                </svg>
            </button>
            <button class="nav-item active" data-tab="casesTab">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"></circle>
                    <path d="m21 21-4.35-4.35"></path>
                </svg>
            </button>
            <button class="nav-item" data-tab="scoreboardTab">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                    <circle cx="9" cy="7" r="4"></circle>
                    <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                    <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                </svg>
            </button>
        </nav>
    </div>

    <script src="app.js"></script>
</body>
</html>
