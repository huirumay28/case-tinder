<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Case Tinder - 每日創意案例</title>
    <link rel="stylesheet" href="styles.css?v=20260903a">
</head>
<body>
    <!-- Sign-in Gate -->
    <div class="signin-gate" id="signinGate">
        <div class="signin-container">
            <h1 class="signin-title">你是誰？</h1>
            <p class="signin-subtitle">加入 Alien Team</p>
            
            <div class="signin-form" id="signinForm">
                <div class="form-step" id="codeStep">
                    <input 
                        type="text" 
                        class="signin-input" 
                        id="inviteCodeInput" 
                        placeholder="邀請碼"
                        autocomplete="off"
                    >
                    <button class="signin-button" id="codeSubmitBtn">繼續</button>
                </div>
                
                <div class="form-step hidden" id="nameStep">
                    <p class="step-instruction">選擇你的名字</p>
                    <div class="name-loading" id="nameLoading">
                        <div class="loading-spinner"></div>
                        <div class="loading-text">載入中…</div>
                    </div>
                    <div class="name-list" id="nameList">
                        <!-- Names will be loaded from API -->
                    </div>
                </div>
            </div>
            
            <div class="error-message" id="errorMessage"></div>
        </div>
    </div>

    <div class="app-container">
        <!-- Tab Content -->
        <div class="tab-content" id="bioTab">
            <!-- My Bio Tab -->
            <div class="bio-container">
                <!-- Streak Headline -->
                <div class="streak-headline">
                    <h1>恭喜，您已經連續 <span class="streak-number" id="streakNumber">0</span> 天 都有看案例！</h1>
                </div>

                <!-- Lion Character -->
                <div class="lion-character" id="lionCharacter">
                    <!-- Lion image will be loaded dynamically -->
                </div>
                
                <!-- Customize Button -->
                <button class="customize-button" id="customizeButton">客製我的大獅</button>

                <!-- Next Unlock Section -->
                <div class="next-unlock-section" id="nextUnlockSection">
                    <div class="unlock-caption">離創意大獅的路已經不遠了！</div>
                    <div class="unlock-info">
                        <span>再 <strong id="daysToUnlock">1</strong> 天即可解鎖</span>
                        <div class="unlock-merch">
                            <div class="merch-icon-small" id="nextMerchIcon"></div>
                            <span id="nextMerchName">貝雷帽</span>
                        </div>
                    </div>
                    <div class="scroll-more-hint">下滑查看更多</div>
                </div>

                <!-- Awards Unlock Section -->
                <div class="awards-section">
                    <h2 class="section-heading">創意大獅之路 - 獎項解鎖</h2>
                    <div class="day-grid" id="dayGrid">
                        <!-- Day grid will be rendered dynamically -->
                    </div>
                </div>

                <!-- Stats Section -->
                <div class="stats-section">
                    <div class="stat-item">
                        <span>目前已累積觀看 <strong id="totalViewCount">0</strong> 個案例</span>
                    </div>
                    <div class="stat-item">
                        <span>其中，有 <strong id="totalLikeCount">0</strong> 個符合您的喜好</span>
                    </div>
                </div>

                <!-- View Liked Cases Button -->
                <button class="view-liked-button" id="viewLikedButton">查看我喜愛的案例</button>

                <!-- Bio Instruction -->
                <div class="bio-instruction">
                    點擊下方 🔍 開始看案例
                </div>
            </div>
        </div>

        <div class="tab-content active" id="casesTab">
            <!-- Card Stack -->
            <div class="card-stack" id="cardStack">
                <!-- Cards will be dynamically rendered here -->
            </div>

            <!-- Empty State -->
            <div class="empty-state" id="emptyState" style="display: none;">
                <div class="empty-icon">🎉</div>
                <h2>今天看完了！</h2>
                <p>明天再來看更多精彩案例</p>
            </div>
        </div>

        <div class="tab-content" id="scoreboardTab">
            <!-- Screen A: Team Ranking -->
            <div class="scoreboard-view active" id="rankingView">
                <div class="scoreboard-header">
                    <h1 class="scoreboard-title">團隊排行榜</h1>
                    <div class="team-subtitle">ALIEN TEAM</div>
                </div>
                <div class="ranking-loading" id="rankingLoading">
                    <div class="loading-spinner"></div>
                    <div class="loading-text">載入中…</div>
                </div>
                <div class="ranking-list" id="rankingList">
                    <!-- Team members will be rendered here -->
                </div>
            </div>

            <!-- Screen B: Liked Cases Detail -->
            <div class="scoreboard-view" id="likedCasesView">
                <div class="detail-header">
                    <button class="back-button" id="backToRanking">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M19 12H5M12 19l-7-7 7-7"/>
                        </svg>
                    </button>
                    <h2 class="detail-title" id="detailTitle">喜歡的案例</h2>
                </div>
                <div class="liked-cases-container" id="likedCasesContainer">
                    <!-- Liked cases will be rendered here -->
                </div>
            </div>
        </div>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav">
            <button class="nav-item" data-tab="bioTab">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                </svg>
            </button>
            <button class="nav-item active" data-tab="casesTab">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"></circle>
                    <path d="m21 21-4.35-4.35"></path>
                </svg>
            </button>
            <button class="nav-item" data-tab="scoreboardTab">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                    <circle cx="9" cy="7" r="4"></circle>
                    <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                    <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                </svg>
            </button>
        </nav>
    </div>

    <!-- Customize Overlay -->
    <div class="customize-overlay" id="customizeOverlay">
        <div class="customize-container">
            <div class="customize-header">
                <button class="back-button" id="customizeBackButton">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M19 12H5M12 19l-7-7 7-7"/>
                    </svg>
                </button>
                <div class="customize-title-section">
                    <h2 class="customize-title">我的創意大獅</h2>
                    <div class="customize-username" id="customizeUsername">User</div>
                </div>
            </div>
            
            <div class="customize-content">
                <!-- Lion Preview -->
                <div class="lion-preview" id="lionPreview">
                    <!-- Lion image will be rendered here -->
                </div>
                
                <!-- Item Selection Row -->
                <div class="item-selection" id="itemSelection">
                    <!-- Items will be rendered here based on selected category -->
                </div>
                
                <!-- Category Tabs -->
                <div class="category-tabs">
                    <button class="category-tab active" data-category="帽子">帽子</button>
                    <button class="category-tab" data-category="臉部">臉部</button>
                    <button class="category-tab" data-category="飾品">飾品</button>
                    <button class="category-tab" data-category="包">包</button>
                </div>
                
                <!-- Action Buttons -->
                <div class="customize-actions">
                    <button class="action-pill-button secondary" id="resetButton">脫光光</button>
                    <button class="action-pill-button primary" id="saveButton">就這套</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Board Image Lightbox -->
    <div class="board-lightbox" id="boardLightbox">
        <button class="lightbox-close" id="lightboxClose" aria-label="關閉">×</button>
        <img class="lightbox-image" id="lightboxImage" src="" alt="Board Image">
    </div>

    <script src="app.js?v=20260903a"></script>
</body>
</html>
