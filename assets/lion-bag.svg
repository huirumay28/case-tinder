    <!-- Bag body - hanging on left side -->
    <rect x="60" y="155" width="20" height="25" rx="2" fill="#FF4458"/>
    
    <!-- Strap over shoulder -->
    <path d="M 68 130 Q 65 140 67 155" fill="none" stroke="#FF4458" stroke-width="3" stroke-linecap="round"/>
    
