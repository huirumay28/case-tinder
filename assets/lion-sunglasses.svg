<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" width="200" height="220">
  <!-- Sunglasses (ис) -->
  <g opacity="0.9">
    <!-- Left lens -->
    <rect x="75" y="70" width="18" height="12" rx="6" fill="#000"/>
    <!-- Right lens -->
    <rect x="107" y="70" width="18" height="12" rx="6" fill="#000"/>
    <!-- Bridge -->
    <rect x="93" y="75" width="14" height="2" fill="#000"/>
    <!-- Left arm -->
    <path d="M 75 76 L 60 76" stroke="#000" stroke-width="2" fill="none"/>
    <!-- Right arm -->
    <path d="M 125 76 L 140 76" stroke="#000" stroke-width="2" fill="none"/>
  </g>
</svg>
