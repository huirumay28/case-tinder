<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" width="200" height="220">
  <!-- Snowboard (бъ) - Cool snowboard leaning against lion's side -->
  <g>
    <!-- Snowboard - rounded rectangle, leaning diagonally -->
    <g transform="rotate(15 145 180)">
      <!-- Main board -->
      <rect x="135" y="140" width="15" height="70" rx="7" fill="#4A6FA5" stroke="#2A4A75" stroke-width="2"/>
      
      <!-- Design stripes -->
      <rect x="135" y="150" width="15" height="8" fill="#FF4458" opacity="0.8"/>
      <rect x="135" y="170" width="15" height="6" fill="#FFD700" opacity="0.8"/>
      <rect x="135" y="190" width="15" height="8" fill="#FFF" opacity="0.8"/>
      
      <!-- Binding (foot strap) -->
      <ellipse cx="142.5" cy="175" rx="8" ry="4" fill="#333" opacity="0.7"/>
      <rect x="139" y="173" width="7" height="4" rx="1" fill="#555"/>
    </g>
    
    <!-- Shadow/ground contact -->
    <ellipse cx="152" cy="215" rx="8" ry="3" fill="#000" opacity="0.2"/>
  </g>
</svg>
