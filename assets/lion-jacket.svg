<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" width="200" height="220">
  <!-- Jacket (W) - Cool denim jacket -->
  <g>
    <!-- Main jacket body -->
    <ellipse cx="100" cy="150" rx="42" ry="50" fill="#4A6FA5" stroke="#3A5A85" stroke-width="2"/>
    <!-- Sleeves -->
    <ellipse cx="66" cy="135" rx="16" ry="24" fill="#4A6FA5" stroke="#3A5A85" stroke-width="2"/>
    <ellipse cx="134" cy="135" rx="16" ry="24" fill="#4A6FA5" stroke="#3A5A85" stroke-width="2"/>
    <!-- Collar -->
    <path d="M 85 122 L 80 135 L 90 130 Z" fill="#4A6FA5" stroke="#3A5A85" stroke-width="2"/>
    <path d="M 115 122 L 120 135 L 110 130 Z" fill="#4A6FA5" stroke="#3A5A85" stroke-width="2"/>
    <!-- Zipper -->
    <line x1="100" y1="125" x2="100" y2="175" stroke="#3A5A85" stroke-width="2"/>
    <!-- Pockets -->
    <rect x="80" y="160" width="15" height="12" rx="2" fill="none" stroke="#3A5A85" stroke-width="1.5"/>
    <rect x="105" y="160" width="15" height="12" rx="2" fill="none" stroke="#3A5A85" stroke-width="1.5"/>
  </g>
</svg>
